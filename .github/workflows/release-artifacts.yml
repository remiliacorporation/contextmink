name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: "Release version, bare semver (example: 0.9.0)"
        required: true
        type: string
      create_release:
        description: "Create a GitHub Release and attach archives"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate release inputs and notes
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          bash scripts/validate_release_dispatch.sh "$VERSION" "$CREATE_RELEASE" "$RELEASE_REF"
          python3 scripts/test_release_notes.py
          python3 scripts/render_release_notes.py "$VERSION" > "$RUNNER_TEMP/release_body.md"

      - name: Retain reviewed release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-contextmink-${{ inputs.artifact_version }}
          path: ${{ runner.temp }}/release_body.md
          if-no-files-found: error

      - name: Install pinned Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-source

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check package contents
        run: cargo package --locked
        env:
          CARGO_TARGET_DIR: target/package-check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-msrv
      - name: Check minimum supported Rust version
        run: cargo +1.95.0 check --locked

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # contextmink-bridge is Windows-purpose (PowerShell argv mangling,
          # MSYS rewriting, Git Bash discovery); POSIX hosts run bash natively,
          # so only the Windows archive carries the bridge binary. The bridge
          # still compiles and tests on every platform.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary_name: contextmink
            archive_ext: tar.gz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary_name: contextmink
            archive_ext: tar.gz
          - os: macos-26
            target: aarch64-apple-darwin
            platform: macos-arm64
            binary_name: contextmink
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary_name: contextmink.exe
            bridge_binary_name: contextmink-bridge.exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772

        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve release names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          version="${RAW}"
          bash scripts/validate_release_dispatch.sh "$version" "$CREATE_RELEASE" "$RELEASE_REF"
          bundle="contextmink-${version}-${PLATFORM}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bundle=${bundle}" >> "$GITHUB_OUTPUT"
          echo "archive=${bundle}.${ARCHIVE_EXT}" >> "$GITHUB_OUTPUT"
        env:
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_REF: ${{ github.ref }}
          RAW: ${{ inputs.artifact_version }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}

      - name: Test native behavior
        if: matrix.platform == 'windows-x86_64' || matrix.platform == 'macos-arm64'
        run: cargo test --locked --all-targets --all-features --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage release bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/${{ steps.names.outputs.bundle }}"
          archive="dist/${{ steps.names.outputs.archive }}"
          mkdir -p "${bundle}/docs" "${bundle}/templates"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${bundle}/"
          cp README.md SETUP.md CHANGELOG.md LICENSE LICENSE-SSL LICENSE-VPL "${bundle}/"
          cp -R docs/. "${bundle}/docs/"
          cp -R templates/. "${bundle}/templates/"
          cat > "${bundle}/manifest.json" <<EOF
          {
            "schema": "contextmink.release-manifest.v1",
            "name": "contextmink",
            "version": "${{ steps.names.outputs.version }}",
            "source_commit": "${GITHUB_SHA}",
            "target": "${{ matrix.target }}",
            "platform": "${{ matrix.platform }}",
            "binary": "${{ matrix.binary_name }}",
            "archive": "${{ steps.names.outputs.archive }}"
          }
          EOF
          chmod +x "${bundle}/${{ matrix.binary_name }}"
          tar -czf "${archive}" -C dist "${{ steps.names.outputs.bundle }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256")
          fi

      - name: Stage release bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "dist/${{ steps.names.outputs.bundle }}"
          $archive = "dist/${{ steps.names.outputs.archive }}"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" $bundle
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bridge_binary_name }}" $bundle
          Copy-Item README.md,SETUP.md,CHANGELOG.md,LICENSE,LICENSE-SSL,LICENSE-VPL $bundle
          Copy-Item -Recurse docs $bundle
          Copy-Item -Recurse templates $bundle
          $manifest = [ordered]@{
            schema = "contextmink.release-manifest.v1"
            name = "contextmink"
            version = "${{ steps.names.outputs.version }}"
            source_commit = "$env:GITHUB_SHA"
            target = "${{ matrix.target }}"
            platform = "${{ matrix.platform }}"
            binary = "${{ matrix.binary_name }}"
            bridge_binary = "${{ matrix.bridge_binary_name }}"
            archive = "${{ steps.names.outputs.archive }}"
          } | ConvertTo-Json
          Set-Content -Path "$bundle/manifest.json" -Value $manifest -NoNewline
          Compress-Archive -Path $bundle -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          # LF, no BOM: sha256sum -c on POSIX shells trips over CRLF filenames.
          [System.IO.File]::WriteAllText("${archive}.sha256", "$hash  ${{ steps.names.outputs.archive }}`n")

      - name: Verify packaged release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/${{ steps.names.outputs.archive }}"
          verify_root="dist/verify-${{ matrix.platform }}"
          mkdir -p "${verify_root}"
          tar -xzf "${archive}" -C "${verify_root}"
          bundle="${verify_root}/${{ steps.names.outputs.bundle }}"
          test -f "${bundle}/${{ matrix.binary_name }}"
          test -f "${bundle}/README.md"
          test -f "${bundle}/SETUP.md"
          test -f "${bundle}/CHANGELOG.md"
          test -f "${bundle}/LICENSE"
          test -f "${bundle}/LICENSE-SSL"
          test -f "${bundle}/LICENSE-VPL"
          test -f "${bundle}/manifest.json"
          grep -Fq '"schema": "contextmink.release-manifest.v1"' "${bundle}/manifest.json"
          grep -Fq "\"source_commit\": \"${GITHUB_SHA}\"" "${bundle}/manifest.json"
          test -d "${bundle}/docs"
          test -d "${bundle}/templates"
          test "$("${bundle}/${{ matrix.binary_name }}" --version)" = "contextmink ${{ steps.names.outputs.version }}"
          "${bundle}/${{ matrix.binary_name }}" --help > /tmp/contextmink-help.txt
          "${bundle}/${{ matrix.binary_name }}" files src --limit 1 > /tmp/contextmink-smoke.txt
          grep -q "CONTEXTMINK_RECEIPT" /tmp/contextmink-smoke.txt
          test -f "${archive}"
          test -f "${archive}.sha256"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c "${{ steps.names.outputs.archive }}.sha256")
          else
            (cd dist && shasum -a 256 -c "${{ steps.names.outputs.archive }}.sha256")
          fi

          project="${verify_root}/integration-project"
          mkdir -p "${project}/nested/work"
          printf 'fixture guidance\n' > "${project}/AGENTS.md"
          printf 'fixture guidance\n' > "${project}/CLAUDE.md"
          "${bundle}/${{ matrix.binary_name }}" --json setup-project "${project}" > "${verify_root}/setup-smoke.json"
          grep -Eq '"schema"[[:space:]]*:[[:space:]]*"contextmink.project_setup.v2"' "${verify_root}/setup-smoke.json"
          grep -Eq '"ready"[[:space:]]*:[[:space:]]*true' "${verify_root}/setup-smoke.json"
          grep -Eq '"resolved_skill_target"[[:space:]]*:[[:space:]]*"both"' "${verify_root}/setup-smoke.json"
          test -f "${project}/tools/contextmink/project-install.json"
          test -f "${project}/tools/contextmink/bin/runtime-install.json"
          printf '{"result":{"total":17}}\n' > "${project}/selection.json"
          (cd "${project}" && scripts/contextmink --json json-select selection.json --at /result/total) > "${verify_root}/pointer-smoke.json"
          grep -Eq '"at"[[:space:]]*:[[:space:]]*"/result/total"' "${verify_root}/pointer-smoke.json"
          grep -Eq '"value"[[:space:]]*:[[:space:]]*"17"' "${verify_root}/pointer-smoke.json"
          test -f "${project}/tools/contextmink/agent_integration.md"
          test -f "${project}/.agents/skills/contextmink/SKILL.md"
          test -f "${project}/.agents/skills/contextmink/agents/openai.yaml"
          test -f "${project}/.claude/skills/contextmink/SKILL.md"
          test ! -e "${project}/scripts/contextmink.cmd"
          grep -Fq '[the canonical skill](../../../.agents/skills/contextmink/SKILL.md)' "${project}/.claude/skills/contextmink/SKILL.md"
          (cd "${project}/.claude/skills/contextmink" && test -f ../../../.agents/skills/contextmink/SKILL.md)
          awk '/^---$/ { if (++delimiters == 2) exit } { print }' "${project}/.agents/skills/contextmink/SKILL.md" > "${verify_root}/agent-frontmatter"
          awk '/^---$/ { if (++delimiters == 2) exit } { print }' "${project}/.claude/skills/contextmink/SKILL.md" > "${verify_root}/claude-frontmatter"
          cmp "${verify_root}/agent-frontmatter" "${verify_root}/claude-frontmatter"
          sed -i.bak 's|exclude_globs = \[\]|exclude_globs = ["generated/**"]|' "${project}/.contextmink.toml"
          rm "${project}/.contextmink.toml.bak"
          rm "${project}/tools/contextmink/bin/${{ matrix.binary_name }}"
          "${bundle}/${{ matrix.binary_name }}" --json setup-project "${project}" --dry-run > "${verify_root}/setup-repair-smoke.json"
          grep -Eq '"action"[[:space:]]*:[[:space:]]*"preserve_repository_owned"' "${verify_root}/setup-repair-smoke.json"
          grep -Eq '"action"[[:space:]]*:[[:space:]]*"create"' "${verify_root}/setup-repair-smoke.json"
          "${bundle}/${{ matrix.binary_name }}" --json setup-project "${project}" > "${verify_root}/setup-repair-apply.json"
          test -f "${project}/tools/contextmink/bin/${{ matrix.binary_name }}"
          grep -Fq 'exclude_globs = ["generated/**"]' "${project}/.contextmink.toml"
          "${bundle}/${{ matrix.binary_name }}" --json setup-project "${project}" --skill-target agents > "${verify_root}/setup-reselect.json"
          grep -Eq '"resolved_skill_target"[[:space:]]*:[[:space:]]*"agents"' "${verify_root}/setup-reselect.json"
          test -f "${project}/.agents/skills/contextmink/SKILL.md"
          test ! -e "${project}/.claude/skills/contextmink/SKILL.md"
          printf 'fixture\n' > "${project}/nested/work/fixture.txt"
          (cd "${project}" && scripts/contextmink --json files . --limit 1) > "${verify_root}/root-smoke.json"
          (cd "${project}/nested/work" && ../../scripts/contextmink --json files . --limit 1) > "${verify_root}/nested-smoke.json"
          grep -Eq '"profile"[[:space:]]*:[[:space:]]*"integration-project"' "${verify_root}/root-smoke.json"
          grep -Eq '"profile"[[:space:]]*:[[:space:]]*"integration-project"' "${verify_root}/nested-smoke.json"
          grep -Eq '"schema"[[:space:]]*:[[:space:]]*"contextmink.receipt.v2"' "${verify_root}/root-smoke.json"
          (cd "${project}" && scripts/contextmink --json guard-check -- git clean) > "${verify_root}/guard-smoke.json"
          grep -Eq '"decision"[[:space:]]*:[[:space:]]*"deny"' "${verify_root}/guard-smoke.json"
          (cd "${project}" && scripts/contextmink --json hook-snippet --binary "tools/contextmink/bin/${{ matrix.binary_name }}" --guard-config .contextmink.toml) > "${verify_root}/hook-smoke.json"
          grep -q '"PreToolUse"' "${verify_root}/hook-smoke.json"
          (cd "${project}" && scripts/contextmink --json capture -- "tools/contextmink/bin/${{ matrix.binary_name }}" --version) > "${verify_root}/capture-smoke.json"
          grep -Eq '"child_exit_code"[[:space:]]*:[[:space:]]*0' "${verify_root}/capture-smoke.json"
          grep -Eq '"child_exit_zero"[[:space:]]*:[[:space:]]*true' "${verify_root}/capture-smoke.json"
          grep -Eq '"exit_expected"[[:space:]]*:[[:space:]]*true' "${verify_root}/capture-smoke.json"
          if grep -Eq '"(exit_code|success)"[[:space:]]*:' "${verify_root}/capture-smoke.json"; then
            echo "capture smoke exposed an ambiguous generic exit field" >&2
            exit 1
          fi
          "${bundle}/${{ matrix.binary_name }}" --json uninstall-project "${project}" --dry-run > "${verify_root}/uninstall-smoke.json"
          grep -Eq '"schema"[[:space:]]*:[[:space:]]*"contextmink.project_uninstall.v1"' "${verify_root}/uninstall-smoke.json"
          grep -Eq '"ready"[[:space:]]*:[[:space:]]*true' "${verify_root}/uninstall-smoke.json"
          "${bundle}/${{ matrix.binary_name }}" --json uninstall-project "${project}" > "${verify_root}/uninstall-apply.json"
          test ! -e "${project}/tools/contextmink/project-install.json"
          test ! -e "${project}/tools/contextmink/bin/runtime-install.json"
          test ! -e "${project}/.agents/skills/contextmink/SKILL.md"
          test ! -e "${project}/.claude/skills/contextmink/SKILL.md"
          grep -Fq 'exclude_globs = ["generated/**"]' "${project}/.contextmink.toml"

          no_skill_project="${verify_root}/no-skill-project"
          mkdir -p "${no_skill_project}"
          "${bundle}/${{ matrix.binary_name }}" --json setup-project "${no_skill_project}" --skill-target none > "${verify_root}/setup-none.json"
          grep -Eq '"resolved_skill_target"[[:space:]]*:[[:space:]]*"none"' "${verify_root}/setup-none.json"
          test ! -e "${no_skill_project}/.agents/skills/contextmink/SKILL.md"
          test ! -e "${no_skill_project}/.claude/skills/contextmink/SKILL.md"
          "${bundle}/${{ matrix.binary_name }}" --json uninstall-project "${no_skill_project}" > "${verify_root}/uninstall-none.json"
          test ! -e "${no_skill_project}/tools/contextmink/project-install.json"

      - name: Verify packaged release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "dist/${{ steps.names.outputs.archive }}"
          $verifyRoot = "dist/verify-${{ matrix.platform }}"
          Expand-Archive -Path $archive -DestinationPath $verifyRoot -Force
          $bundle = "$verifyRoot/${{ steps.names.outputs.bundle }}"
          $binary = "$bundle/${{ matrix.binary_name }}"
          if (!(Test-Path $binary)) { throw "release binary missing" }
          $bridge = "$bundle/${{ matrix.bridge_binary_name }}"
          if (!(Test-Path $bridge)) { throw "bridge binary missing" }
          & $bridge --version
          $bridgeHelp = & $bridge --help | Out-String
          if ($bridgeHelp -notmatch "argv-b64") { throw "bridge help missing argv-b64" }
          if (!(Test-Path "$bundle/README.md")) { throw "README.md missing" }
          if (!(Test-Path "$bundle/SETUP.md")) { throw "SETUP.md missing" }
          if (!(Test-Path "$bundle/CHANGELOG.md")) { throw "CHANGELOG.md missing" }
          if (!(Test-Path "$bundle/LICENSE")) { throw "LICENSE missing" }
          if (!(Test-Path "$bundle/LICENSE-SSL")) { throw "LICENSE-SSL missing" }
          if (!(Test-Path "$bundle/LICENSE-VPL")) { throw "LICENSE-VPL missing" }
          if (!(Test-Path "$bundle/manifest.json")) { throw "manifest.json missing" }
          $releaseManifest = Get-Content "$bundle/manifest.json" -Raw | ConvertFrom-Json
          if ($releaseManifest.schema -ne "contextmink.release-manifest.v1") {
            throw "release manifest schema mismatch: $($releaseManifest.schema)"
          }
          if ($releaseManifest.source_commit -ne $env:GITHUB_SHA) {
            throw "release manifest source commit mismatch: $($releaseManifest.source_commit)"
          }
          if (!(Test-Path "$bundle/docs")) { throw "docs missing" }
          if (!(Test-Path "$bundle/templates")) { throw "templates missing" }
          $reportedVersion = & $binary --version
          if ($reportedVersion -ne "contextmink ${{ steps.names.outputs.version }}") {
            throw "binary version mismatch: $reportedVersion"
          }
          & $binary --help | Out-File -Encoding utf8 "$env:TEMP/contextmink-help.txt"
          & $binary files src --limit 1 | Tee-Object -FilePath "$env:TEMP/contextmink-smoke.txt"
          if (!(Select-String -Path "$env:TEMP/contextmink-smoke.txt" -Pattern "CONTEXTMINK_RECEIPT")) {
            throw "smoke output missing receipt"
          }
          if (!(Test-Path $archive)) { throw "archive missing" }
          $checksumPath = "${archive}.sha256"
          if (!(Test-Path $checksumPath)) { throw "checksum missing" }
          $expectedHash = ((Get-Content $checksumPath -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "archive checksum mismatch" }

          $project = "$verifyRoot/integration-project"
          New-Item -ItemType Directory -Force -Path "$project/nested/work" | Out-Null
          $project = (Resolve-Path $project).Path
          Set-Content -Path "$project/AGENTS.md" -Value "fixture guidance" -NoNewline
          Set-Content -Path "$project/CLAUDE.md" -Value "fixture guidance" -NoNewline
          $setupSmoke = (& $binary --json setup-project $project | Out-String) | ConvertFrom-Json
          if ($setupSmoke.schema -ne "contextmink.project_setup.v2" -or !$setupSmoke.ready) { throw "setup-project schema or readiness mismatch" }
          if ($setupSmoke.resolved_skill_target -ne "both") { throw "setup-project auto target mismatch" }
          if (!(Test-Path "$project/tools/contextmink/project-install.json")) { throw "project-install receipt missing" }
          if (!(Test-Path "$project/tools/contextmink/bin/runtime-install.json")) { throw "runtime-install receipt missing" }
          if (!(Test-Path "$project/tools/contextmink/agent_integration.md")) { throw "agent integration reference missing" }
          $agentSkill = "$project/.agents/skills/contextmink/SKILL.md"
          $claudeSkill = "$project/.claude/skills/contextmink/SKILL.md"
          if (!(Test-Path $agentSkill)) { throw "Agent Skills contextmink envelope missing" }
          if (!(Test-Path "$project/.agents/skills/contextmink/agents/openai.yaml")) { throw "Codex skill metadata missing" }
          if (!(Test-Path $claudeSkill)) { throw "Claude contextmink envelope missing" }
          $canonicalText = (Get-Content -Raw $agentSkill).Replace("`r`n", "`n")
          $routerText = (Get-Content -Raw $claudeSkill).Replace("`r`n", "`n")
          if ($canonicalText.Split("`n---`n", 2)[0] -ne $routerText.Split("`n---`n", 2)[0]) { throw "contextmink skill metadata diverged" }
          if (!$routerText.Contains('[the canonical skill](../../../.agents/skills/contextmink/SKILL.md)')) { throw "contextmink canonical skill route missing" }
          $routerTarget = Join-Path (Split-Path $claudeSkill) '../../../.agents/skills/contextmink/SKILL.md'
          if ((Resolve-Path $routerTarget).Path -ne (Resolve-Path $agentSkill).Path) { throw "contextmink skill route does not resolve" }
          if (Test-Path "$project/scripts/contextmink.cmd") { throw "retired PowerShell diagnostic shim was installed" }
          $projectBin = "$project/tools/contextmink/bin"
          Set-Content -LiteralPath "$project/selection.json" -Value '{"result":{"total":17}}'
          $pointerSmoke = (& "$projectBin/contextmink-bridge.exe" --script "$project/scripts/contextmink" -- --json json-select "$project/selection.json" --at /result/total | Out-String) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pointerSmoke.at -ne "/result/total" -or $pointerSmoke.rows[0].value -ne "17") { throw "installed launcher JSON Pointer selection failed" }
          $configPath = "$project/.contextmink.toml"
          $configText = (Get-Content -Raw -Path $configPath).Replace(
            'exclude_globs = []',
            'exclude_globs = ["generated/**"]'
          )
          Set-Content -Path $configPath -Value $configText -NoNewline
          Remove-Item -LiteralPath "$projectBin/contextmink.exe"
          $repairSmoke = (& $binary --json setup-project $project --dry-run | Out-String) | ConvertFrom-Json
          if (!($repairSmoke.actions | Where-Object { $_.path -eq ".contextmink.toml" -and $_.action -eq "preserve_repository_owned" })) {
            throw "setup-project did not preserve repository-owned config"
          }
          if (!($repairSmoke.actions | Where-Object { $_.path -eq "tools/contextmink/bin/contextmink.exe" -and $_.action -eq "create" })) {
            throw "setup-project did not plan missing binary repair"
          }
          & $binary --json setup-project $project | Out-Null
          if (!(Test-Path "$projectBin/contextmink.exe")) { throw "setup-project did not restore missing binary" }
          if (!(Select-String -Path "$project/.contextmink.toml" -SimpleMatch 'exclude_globs = ["generated/**"]')) {
            throw "setup-project changed repository-owned config"
          }
          $reselection = (& $binary --json setup-project $project --skill-target agents | Out-String) | ConvertFrom-Json
          if ($reselection.resolved_skill_target -ne "agents") { throw "setup-project reselection mismatch" }
          if (!(Test-Path $agentSkill) -or (Test-Path $claudeSkill)) { throw "setup-project did not retire deselected Claude skill" }
          Set-Content -Path "$project/nested/work/fixture.txt" -Value "fixture" -NoNewline
          $projectBinary = "$projectBin/contextmink.exe"
          $projectBridge = "$projectBin/contextmink-bridge.exe"
          Push-Location $project
          try {
            $rootSmoke = (& $projectBinary --json files . --limit 1 | Out-String) | ConvertFrom-Json
            $guardSmoke = (& $projectBinary --json guard-check -- git clean | Out-String) | ConvertFrom-Json
            $hookSmoke = (& $projectBinary --json hook-snippet --binary $projectBinary --guard-config "$project/.contextmink.toml" | Out-String) | ConvertFrom-Json
            $captureSmoke = (& $projectBinary --json capture -- $projectBinary --version | Out-String) | ConvertFrom-Json
          } finally {
            Pop-Location
          }
          if ($rootSmoke.profile -ne "integration-project") { throw "root config discovery failed" }
          if ($rootSmoke.schema -ne "contextmink.receipt.v2") { throw "root receipt schema mismatch" }
          if ($guardSmoke.decision -ne "deny") { throw "guard-check integration smoke failed" }
          if (!$hookSmoke.hooks.PreToolUse) { throw "hook-snippet integration smoke failed" }
          if ($captureSmoke.child_exit_code -ne 0 -or !$captureSmoke.child_exit_zero -or !$captureSmoke.exit_expected) {
            throw "capture exit contract smoke failed"
          }
          if ($captureSmoke.PSObject.Properties.Name -contains 'exit_code' -or $captureSmoke.PSObject.Properties.Name -contains 'success') {
            throw "capture smoke exposed an ambiguous generic exit field"
          }
          Push-Location "$project/nested/work"
          try {
            $nestedSmoke = (& $projectBridge --script scripts/contextmink --json files . --limit 1 | Out-String) | ConvertFrom-Json
          } finally {
            Pop-Location
          }
          if ($nestedSmoke.profile -ne "integration-project") { throw "nested bridge config discovery failed" }
          $probeArgs = @('native-child', '/type/path', 'he said "hi"', '')
          $probeToken = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($probeArgs -join [char]0)))
          $argvEcho = & $projectBridge --print-argv --argv-b64 $probeToken | Out-String
          if ($argvEcho -notmatch 'argv\[1\]=/type/path' -or $argvEcho -notmatch 'argv\[2\]=he said "hi"') {
            throw "bridge argv relay smoke failed"
          }
          $uninstallSmoke = (& $binary --json uninstall-project $project --dry-run | Out-String) | ConvertFrom-Json
          if ($uninstallSmoke.schema -ne "contextmink.project_uninstall.v1" -or !$uninstallSmoke.ready) {
            throw "uninstall-project preflight failed"
          }
          & $binary --json uninstall-project $project | Out-Null
          if (Test-Path "$project/tools/contextmink/project-install.json") { throw "project-install receipt was not removed" }
          if (Test-Path "$project/tools/contextmink/bin/runtime-install.json") { throw "runtime-install receipt was not removed" }
          if ((Test-Path $agentSkill) -or (Test-Path $claudeSkill)) { throw "managed Contextmink skill was not removed" }
          if (!(Select-String -Path $configPath -SimpleMatch 'exclude_globs = ["generated/**"]')) {
            throw "uninstall-project changed repository-owned config"
          }

          $noSkillProject = "$verifyRoot/no-skill-project"
          New-Item -ItemType Directory -Force -Path $noSkillProject | Out-Null
          $noneSetup = (& $binary --json setup-project $noSkillProject --skill-target none | Out-String) | ConvertFrom-Json
          if ($noneSetup.resolved_skill_target -ne "none") { throw "explicit no-skill setup mismatch" }
          if ((Test-Path "$noSkillProject/.agents/skills/contextmink/SKILL.md") -or (Test-Path "$noSkillProject/.claude/skills/contextmink/SKILL.md")) {
            throw "no-skill setup installed a harness skill"
          }
          & $binary --json uninstall-project $noSkillProject | Out-Null
          if (Test-Path "$noSkillProject/tools/contextmink/project-install.json") { throw "no-skill uninstall left the project receipt" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contextmink-release-${{ steps.names.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/${{ steps.names.outputs.archive }}
            dist/${{ steps.names.outputs.archive }}.sha256
          if-no-files-found: error

  publish-release:
    if: inputs.create_release
    needs: [verify-source, msrv, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version="${RAW}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
        env:
          RAW: ${{ inputs.artifact_version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: contextmink-release-${{ steps.ver.outputs.version }}-*
          merge-multiple: true

      - name: List downloaded assets
        run: ls -lh release-assets/

      - name: Render release notes
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: python3 scripts/render_release_notes.py "$VERSION" > release_body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          release_flags=()
          if [[ "${version}" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "contextmink ${{ steps.ver.outputs.version }}" \
            --notes-file release_body.md \
            "${release_flags[@]}" \
            release-assets/*
