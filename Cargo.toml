[package]
name = "contextmink"
version = "0.10.0"
edition = "2024"
rust-version = "1.95"
description = "A bounded, machine-readable transcript guard for AI-assisted software work."
license = "MIT"
readme = "README.md"
repository = "https://github.com/remiliacorporation/contextmink"
publish = false
autobins = false
exclude = ["/.claude/settings*.json"]

[[bin]]
name = "contextmink"
path = "src/main.rs"

[[bin]]
name = "contextmink-bridge"
path = "src/bin/contextmink_bridge.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "functions", "hooks"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
toml = "1.1.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
